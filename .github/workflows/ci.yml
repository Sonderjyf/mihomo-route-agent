name: Offline Go checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.10'
          cache: false
      - run: go mod download
      - name: Windows owned-process query diagnostic (no core or network changes)
        if: runner.os == 'Windows'
        run: go test ./internal/route -run '^TestWindowsOwnedQueryMechanism$' -v -count=1
        env:
          ROUTE_AGENT_QUERY_DIAGNOSTIC: '1'
          GOPROXY: off
          GOSUMDB: off
      - name: Tests (local endpoints only)
        run: go test ./...
        env:
          GOPROXY: off
          GOSUMDB: off
      - run: go vet ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go build -trimpath ./cmd/route-agent
      - name: Windows portable package offline smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = ./scripts/package.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP 'portable-package')
          ./scripts/test-package.ps1 -Archive $archive
      - name: Offline TUN acceptance guards (no network changes)
        run: python -B -m unittest discover -s scripts -p test_tun_acceptance.py -v
      - name: Offline supervised lifecycle guards (does not run acceptance)
        run: python -B -m unittest discover -s scripts -p test_lifecycle_acceptance.py -v
      - name: Offline FlClash config contract (does not run FlClash)
        run: python -B -m unittest discover -s scripts -p test_flclash*acceptance.py -v
