name: Explicit owned Windows TUN acceptance
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  core-tun:
    if: >-
      github.event.label.name == 'accept-core-tun-on-hosted-windows' &&
      github.event.pull_request.number == 5 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/review-dns-correctness'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.10'
          cache: false
      - name: Prepare owned guest tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv .acceptance-venv
          if ($LASTEXITCODE -ne 0) { throw 'Guest Python setup failed' }
          & ./.acceptance-venv/Scripts/python.exe -m pip install --disable-pip-version-check -r requirements-smoke.txt
          if ($LASTEXITCODE -ne 0) { throw 'Guest dependency setup failed' }
          $ownedRoot = Join-Path $env:RUNNER_TEMP 'route-agent-core-tun'
          New-Item -ItemType Directory -Path $ownedRoot | Out-Null
          $archive = Join-Path $ownedRoot 'mihomo.zip'
          Invoke-WebRequest -Uri 'https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-windows-amd64-v1.19.32.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '1ac84e795b5b915446e20139677fb6cc013a0778e876e8d4c96f994750b4c4a3') { throw 'Core archive hash mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $ownedRoot 'core')
          $executables = @(Get-ChildItem -LiteralPath (Join-Path $ownedRoot 'core') -File -Recurse | Where-Object {$_.Name -match '^mihomo.*\.exe$'})
          if ($executables.Count -ne 1) { throw 'Unexpected core archive layout' }
          "ACCEPTANCE_CORE=$($executables[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          go build -trimpath -o route-agent.exe ./cmd/route-agent
          if ($LASTEXITCODE -ne 0) { throw 'Agent build failed' }
      - name: Test execution guards
        run: ./.acceptance-venv/Scripts/python.exe -B -m unittest discover -s scripts -p test_tun_acceptance.py -v
      - name: Native TUN route and mode drift
        run: ./.acceptance-venv/Scripts/python.exe -B scripts/tun_acceptance.py --execute --allow-isolated-tun --agent route-agent.exe --mihomo "$env:ACCEPTANCE_CORE" --workdir guest-tun-mode
      - name: Native TUN lifecycle
        run: ./.acceptance-venv/Scripts/python.exe -B scripts/tun_acceptance.py --execute --allow-isolated-tun --agent route-agent.exe --mihomo "$env:ACCEPTANCE_CORE" --workdir guest-tun-lifecycle --lifecycle
      - name: Report synthetic results
        if: always()
        shell: pwsh
        run: |
          foreach ($folder in @('guest-tun-mode', 'guest-tun-lifecycle')) {
            $report = Join-Path $folder 'result.json'
            if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report -Raw }
          }
